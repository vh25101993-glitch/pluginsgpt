name: temporary curated element photo pack
on:
  push:
    branches: [tmp-element-photos-20260829]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow requests
      - run: python .chem-elements/fetch_elements.py
      - run: |
          cd .chem-elements
          zip -9 -r element-photo-pack.zip out >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: element-photo-pack
          path: .chem-elements/element-photo-pack.zip
          compression-level: 0
          retention-days: 1
