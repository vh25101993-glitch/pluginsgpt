name: temporary chemistry image pack builder v2
on:
  push:
    branches: [tmp-chem-images-v1992-20260829]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow requests
      - run: rm -rf .chem-images/out && python .chem-images/fetch_images_v2.py
      - run: |
          cd .chem-images
          zip -9 -r chem-image-pack-v2.zip out >/dev/null
          sha256sum chem-image-pack-v2.zip > chem-image-pack-v2.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: chem-image-pack-v2
          path: |
            .chem-images/chem-image-pack-v2.zip
            .chem-images/chem-image-pack-v2.sha256
          compression-level: 0
          retention-days: 1
